[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "bottle",
    "psycopg[binary]",
    "SQLAlchemy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
