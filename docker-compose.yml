# Startup gate reused by every app service: don't boot until the one-shot
# seed container has finished (it in turn waits for migrations, which wait
# for Postgres). Without this the services race the DB and die with
# "connection refused" on a cold start.
x-depends-on-db: &depends-on-db
  db-seed:
    condition: service_completed_successfully

# Compose DNS names. Override them in .env; the Python helper requires the
# variables and does not keep a second copy of the host.
x-service-urls: &service-urls
  MARKET_DATA_SERVICE_URL: ${MARKET_DATA_SERVICE_URL:-http://market-data-service:8001}
  MARKET_DATA_INTEGRATION_URL: ${MARKET_DATA_INTEGRATION_URL:-http://market-data-service-integration:8005}
  PRICING_SERVICE_URL: ${PRICING_SERVICE_URL:-http://pricing-service:8002}
  BOOKS_SERVICE_URL: ${BOOKS_SERVICE_URL:-http://books-service:8004}
  TRADE_ACTION_SERVICE_URL: ${TRADE_ACTION_SERVICE_URL:-http://trade-action-service:8080}
  TRADE_GENERATION_SERVICE_URL: ${TRADE_GENERATION_SERVICE_URL:-http://trade-generation-service:8007}
  BLOTTER_SERVICE_URL: ${BLOTTER_SERVICE_URL:-http://blotter-service:8006}

x-runtime: &runtime
  DATABASE_URL: ${DATABASE_URL}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-quote-age: &quote-age
  TRADE_ACTION_MAX_QUOTE_AGE_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_SECONDS:-120}
  TRADE_ACTION_MAX_QUOTE_AGE_EQUITY_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_EQUITY_SECONDS:-120}
  TRADE_ACTION_MAX_QUOTE_AGE_FX_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_FX_SECONDS:-60}
  TRADE_ACTION_MAX_QUOTE_AGE_FUTURES_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_FUTURES_SECONDS:-120}
  TRADE_ACTION_MAX_QUOTE_AGE_OPTION_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_OPTION_SECONDS:-120}
  TRADE_ACTION_MAX_QUOTE_AGE_COMMODITY_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_COMMODITY_SECONDS:-300}
  TRADE_ACTION_MAX_QUOTE_AGE_BOND_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_BOND_SECONDS:-86400}
  TRADE_ACTION_MAX_QUOTE_AGE_IRS_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_IRS_SECONDS:-86400}
  TRADE_ACTION_MAX_QUOTE_AGE_BENCHMARK_SECONDS: ${TRADE_ACTION_MAX_QUOTE_AGE_BENCHMARK_SECONDS:-86400}

services:
  postgres:
      image: postgres:15
      environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: market_data_db
      ports:
        - "5433:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d market_data_db"]
        interval: 3s
        timeout: 3s
        retries: 5
  db-migrations:
    build: ./db
    # "Drogi Dockerze, cokolwiek Twój program stworzy lub zmieni w swoim wewnętrznym folderze /app,
    # natychmiast skopiuj to jeden do jednego do folderu db na moim laptopie".
    volumes:
      - ./db:/app
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
          postgres:
            condition: service_healthy
  db-seed:
    build: ./db
    volumes:
      - ./db:/app
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: python seed_provider_limits.py
    depends_on:
      db-migrations:
        condition: service_completed_successfully
  market-data-service:
    build: ./services/market-data-service
    ports:
      - "8001:8001"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime]
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-500}
      MARKET_DATA_PERSIST_BATCH_SIZE: ${MARKET_DATA_PERSIST_BATCH_SIZE:-30}
    depends_on: *depends-on-db
  pricing-service:
    build: ./services/pricing-service
    ports:
      - "8002:8002"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime, *quote-age]
      BOOK_METRICS_WINDOW: ${BOOK_METRICS_WINDOW:-100}
      PRICING_BASE_RECONNECT_DELAY_SECONDS: ${PRICING_BASE_RECONNECT_DELAY_SECONDS:-1}
      PRICING_MAX_RECONNECT_DELAY_SECONDS: ${PRICING_MAX_RECONNECT_DELAY_SECONDS:-30}
      PRICING_QUOTE_CONCURRENCY: ${PRICING_QUOTE_CONCURRENCY:-8}
      PRICING_QUOTE_TIMEOUT_SECONDS: ${PRICING_QUOTE_TIMEOUT_SECONDS:-5}
      PRICING_STREAM_CONNECT_TIMEOUT_SECONDS: ${PRICING_STREAM_CONNECT_TIMEOUT_SECONDS:-5}
      PRICING_STREAM_READ_TIMEOUT_SECONDS: ${PRICING_STREAM_READ_TIMEOUT_SECONDS:-30}
      PRICING_VALUATION_BATCH_CAP: ${PRICING_VALUATION_BATCH_CAP:-200}
      PRICING_VALUATION_FLUSH_ATTEMPTS: ${PRICING_VALUATION_FLUSH_ATTEMPTS:-3}
      PRICING_FLUSH_RETRY_SECONDS: ${PRICING_FLUSH_RETRY_SECONDS:-0.5}
      PRICING_POLL_INTERVAL_SECONDS: ${PRICING_POLL_INTERVAL_SECONDS:-5}
      PRICING_SSE_QUEUE_MAX: ${PRICING_SSE_QUEUE_MAX:-256}
    depends_on: *depends-on-db
  monitoring-service:
    build: ./services/monitoring-service
    ports:
      - "8003:8003"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime]
      MONITORING_PROBE_TIMEOUT_SECONDS: ${MONITORING_PROBE_TIMEOUT_SECONDS:-2}
      MONITORING_PROBE_INTERVAL_SECONDS: ${MONITORING_PROBE_INTERVAL_SECONDS:-1}
      MONITORING_PROBE_TTL_SECONDS: ${MONITORING_PROBE_TTL_SECONDS:-10}
      MONITORING_ERROR_WINDOW_SECONDS: ${MONITORING_ERROR_WINDOW_SECONDS:-300}
    depends_on: *depends-on-db
  books-service:
    build: ./services/books-service
    ports:
      - "8004:8004"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime]
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-90}
      AUDIT_PURGE_BATCH_SIZE: ${AUDIT_PURGE_BATCH_SIZE:-1000}
      AUDIT_PURGE_INTERVAL_SECONDS: ${AUDIT_PURGE_INTERVAL_SECONDS:-86400}
    depends_on: *depends-on-db
  blotter-service:
    build: ./services/blotter-service
    ports:
      - "8006:8006"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime]
      BLOTTER_BASE_RECONNECT_DELAY_SECONDS: ${BLOTTER_BASE_RECONNECT_DELAY_SECONDS:-1}
      BLOTTER_MAX_RECONNECT_DELAY_SECONDS: ${BLOTTER_MAX_RECONNECT_DELAY_SECONDS:-30}
      BLOTTER_STREAM_TIMEOUT_SECONDS: ${BLOTTER_STREAM_TIMEOUT_SECONDS:-30}
      BLOTTER_BOOKS_TIMEOUT_SECONDS: ${BLOTTER_BOOKS_TIMEOUT_SECONDS:-2}
      BLOTTER_JOIN_TIMEOUT_SECONDS: ${BLOTTER_JOIN_TIMEOUT_SECONDS:-5}
      BLOTTER_MAX_VALUATIONS_PER_TRADE: ${BLOTTER_MAX_VALUATIONS_PER_TRADE:-20}
    depends_on: *depends-on-db
  trade-generation-service:
    build: ./services/trade-generation-service
    ports:
      - "8007:8007"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime]
      TICK_INTERVAL_MS: ${TICK_INTERVAL_MS:-500}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      TRADE_GENERATION_INTERVAL_MS: ${TRADE_GENERATION_INTERVAL_MS:-4000}
      TRADE_GENERATION_BATCH_SIZE: ${TRADE_GENERATION_BATCH_SIZE:-10}
      TRADE_GENERATION_OPEN_WEIGHT_PCT: ${TRADE_GENERATION_OPEN_WEIGHT_PCT:-70}
      TRADE_GENERATION_CLOSE_WEIGHT_PCT: ${TRADE_GENERATION_CLOSE_WEIGHT_PCT:-30}
      TRADE_GENERATION_QTY_MIN: ${TRADE_GENERATION_QTY_MIN:-10}
      TRADE_GENERATION_QTY_MAX: ${TRADE_GENERATION_QTY_MAX:-1000}
      TRADE_GENERATION_PRICE_MIN: ${TRADE_GENERATION_PRICE_MIN:-50}
      TRADE_GENERATION_PRICE_MAX: ${TRADE_GENERATION_PRICE_MAX:-150}
      USE_PROVIDER_DATA: ${USE_PROVIDER_DATA:-false}
      TRADE_GENERATION_HTTP_TIMEOUT_SECONDS: ${TRADE_GENERATION_HTTP_TIMEOUT_SECONDS:-5}
      TRADE_GENERATION_HTTP_CONNECT_TIMEOUT_SECONDS: ${TRADE_GENERATION_HTTP_CONNECT_TIMEOUT_SECONDS:-2}
      TRADE_GENERATION_FETCH_TIMEOUT_SECONDS: ${TRADE_GENERATION_FETCH_TIMEOUT_SECONDS:-2}
      TRADE_GENERATION_PROVIDER_MODE_TIMEOUT_SECONDS: ${TRADE_GENERATION_PROVIDER_MODE_TIMEOUT_SECONDS:-5}
      TRADE_GENERATION_HTTP_MAX_CONNECTIONS: ${TRADE_GENERATION_HTTP_MAX_CONNECTIONS:-10}
      TRADE_GENERATION_PROVIDER_LOOP_INTERVAL_MS: ${TRADE_GENERATION_PROVIDER_LOOP_INTERVAL_MS:-15000}
      TRADE_GENERATION_JOIN_TIMEOUT_SECONDS: ${TRADE_GENERATION_JOIN_TIMEOUT_SECONDS:-25}
    depends_on: *depends-on-db
  market-data-service-integration:
    build: ./services/market-data-service-integration
    ports:
      - "8005:8005"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime]
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY}
      ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY}
      FRED_API_KEY: ${FRED_API_KEY}
      MARKET_DATA_POLL_INTERVAL_SECONDS: ${MARKET_DATA_POLL_INTERVAL_SECONDS:-30}
      CURVE_DATA_REFRESH_INTERVAL_SECONDS: ${CURVE_DATA_REFRESH_INTERVAL_SECONDS:-3600}
      MARKET_DATA_SYMBOLS: ${MARKET_DATA_SYMBOLS:-AAPL,MSFT,TSLA,GOOGL,AMZN,NVDA,SPY,QQQ,EURUSD,GBPUSD,USDJPY}
      MARKET_DATA_FX_SYMBOLS: ${MARKET_DATA_FX_SYMBOLS:-EURUSD,GBPUSD,USDJPY}
      MARKET_DATA_BOND_SYMBOLS: ${MARKET_DATA_BOND_SYMBOLS:-USD_5Y,USD_10Y,EUR_10Y}
      MARKET_DATA_IRS_SYMBOLS: ${MARKET_DATA_IRS_SYMBOLS:-USD_5Y_IRS,USD_10Y_IRS,EUR_10Y_IRS}
      MARKET_DATA_FUTURES_CONTRACTS: ${MARKET_DATA_FUTURES_CONTRACTS:-ES:SPY:50,MES:SPY:5,NQ:QQQ:20}
      PROVIDER_FETCH_TIMEOUT_SECONDS: ${PROVIDER_FETCH_TIMEOUT_SECONDS:-10}
      MARKET_DATA_MOCK_STREAM: ${MARKET_DATA_MOCK_STREAM:-false}
      MARKET_DATA_MOCK_INTERVAL_SECONDS: ${MARKET_DATA_MOCK_INTERVAL_SECONDS:-2}
      MARKET_DATA_AUDIT_BATCH_SIZE: ${MARKET_DATA_AUDIT_BATCH_SIZE:-10}
      MARKET_DATA_AUDIT_FLUSH_SECONDS: ${MARKET_DATA_AUDIT_FLUSH_SECONDS:-5}
      MARKET_DATA_CURVE_QUEUE_MAXSIZE: ${MARKET_DATA_CURVE_QUEUE_MAXSIZE:-1000}
      MARKET_DATA_CURVE_PERSIST_BATCH_SIZE: ${MARKET_DATA_CURVE_PERSIST_BATCH_SIZE:-20}
      MARKET_DATA_CURVE_PERSIST_FLUSH_SECONDS: ${MARKET_DATA_CURVE_PERSIST_FLUSH_SECONDS:-2.0}
    depends_on: *depends-on-db
  trade-action-service:
    build: ./services/trade-action-service
    ports:
      - "8080:8080"
    volumes:
      - ./shared:/app/shared
    environment:
      <<: [*service-urls, *runtime, *quote-age]
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-1048576}
      TRADE_ACTION_QUEUE_MAXSIZE: ${TRADE_ACTION_QUEUE_MAXSIZE:-100}
      TRADE_ACTION_MAX_CLOCK_SKEW_SECONDS: ${TRADE_ACTION_MAX_CLOCK_SKEW_SECONDS:-5}
      TRADE_ACTION_MAX_BATCH_SIZE: ${TRADE_ACTION_MAX_BATCH_SIZE:-100}
      TRADE_ACTION_RECENT_ACTIONS_LIMIT: ${TRADE_ACTION_RECENT_ACTIONS_LIMIT:-50}
      TRADE_ACTION_RECENT_REJECTS_LIMIT: ${TRADE_ACTION_RECENT_REJECTS_LIMIT:-20}
      TRADE_ACTION_THROUGHPUT_WINDOW_SECONDS: ${TRADE_ACTION_THROUGHPUT_WINDOW_SECONDS:-60}
      TRADE_ACTION_PRESSURE_FILL_PCT: ${TRADE_ACTION_PRESSURE_FILL_PCT:-70}
      USE_PROVIDER_DATA: ${USE_PROVIDER_DATA:-false}
    depends_on: *depends-on-db
