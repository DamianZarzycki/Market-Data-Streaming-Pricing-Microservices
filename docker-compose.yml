# Startup gate reused by every app service: don't boot until the one-shot
# seed container has finished (it in turn waits for migrations, which wait
# for Postgres). Without this the services race the DB and die with
# "connection refused" on a cold start.
x-depends-on-db: &depends-on-db
  db-seed:
    condition: service_completed_successfully

services:
  postgres:
      image: postgres:15
      environment:
        POSTGRES_USER: user
        POSTGRES_PASSWORD: password
        POSTGRES_DB: market_data_db
      ports:
        - "5433:5432"
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d market_data_db"]
        interval: 3s
        timeout: 3s
        retries: 5
  db-migrations:
    build: ./db
    # "Drogi Dockerze, cokolwiek Twój program stworzy lub zmieni w swoim wewnętrznym folderze /app,
    # natychmiast skopiuj to jeden do jednego do folderu db na moim laptopie".
    volumes:
      - ./db:/app
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
          postgres:
            condition: service_healthy
  db-seed:
    build: ./db
    volumes:
      - ./db:/app
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    command: python seed_provider_limits.py
    depends_on:
      db-migrations:
        condition: service_completed_successfully
  market-data-service:
    build: ./services/market-data-service
    ports:
      - "8001:8001"
    volumes:
      - ./shared:/app/shared
    environment:
      - TICK_INTERVAL_MS=500
      - DATABASE_URL=${DATABASE_URL}
    depends_on: *depends-on-db
  pricing-service:
    build: ./services/pricing-service
    ports:
      - "8002:8002"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on: *depends-on-db
  monitoring-service:
    build: ./services/monitoring-service
    ports:
      - "8003:8003"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on: *depends-on-db
  books-service:
    build: ./services/books-service
    ports:
      - "8004:8004"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on: *depends-on-db
  blotter-service:
    build: ./services/blotter-service
    ports:
      - "8006:8006"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
    depends_on: *depends-on-db
  trade-generation-service:
    build: ./services/trade-generation-service
    ports:
      - "8007:8007"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TRADE_GENERATION_INTERVAL_MS=${TRADE_GENERATION_INTERVAL_MS:-4000}
      - TRADE_GENERATION_BATCH_SIZE=${TRADE_GENERATION_BATCH_SIZE:-10}
      - TRADE_GENERATION_OPEN_WEIGHT_PCT=${TRADE_GENERATION_OPEN_WEIGHT_PCT:-70}
      - TRADE_GENERATION_CLOSE_WEIGHT_PCT=${TRADE_GENERATION_CLOSE_WEIGHT_PCT:-30}
      - TRADE_GENERATION_QTY_MIN=${TRADE_GENERATION_QTY_MIN:-10}
      - TRADE_GENERATION_QTY_MAX=${TRADE_GENERATION_QTY_MAX:-1000}
      - TRADE_GENERATION_PRICE_MIN=${TRADE_GENERATION_PRICE_MIN:-50}
      - TRADE_GENERATION_PRICE_MAX=${TRADE_GENERATION_PRICE_MAX:-150}
      - USE_PROVIDER_DATA=${USE_PROVIDER_DATA:-false}
    depends_on: *depends-on-db
  market-data-service-integration:
    build: ./services/market-data-service-integration
    ports:
      - "8005:8005"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}
      - ALPHAVANTAGE_API_KEY=${ALPHAVANTAGE_API_KEY}
      - FRED_API_KEY=${FRED_API_KEY}
      - MARKET_DATA_POLL_INTERVAL_SECONDS=${MARKET_DATA_POLL_INTERVAL_SECONDS:-30}
      - CURVE_DATA_REFRESH_INTERVAL_SECONDS=${CURVE_DATA_REFRESH_INTERVAL_SECONDS:-3600}
      - MARKET_DATA_SYMBOLS=${MARKET_DATA_SYMBOLS:-AAPL,MSFT,TSLA,GOOGL,AMZN,NVDA,SPY,QQQ,EURUSD,GBPUSD,USDJPY}
      - MARKET_DATA_FX_SYMBOLS=${MARKET_DATA_FX_SYMBOLS:-EURUSD,GBPUSD,USDJPY}
      - MARKET_DATA_BOND_SYMBOLS=${MARKET_DATA_BOND_SYMBOLS:-USD_5Y,USD_10Y,EUR_10Y}
      - MARKET_DATA_IRS_SYMBOLS=${MARKET_DATA_IRS_SYMBOLS:-USD_5Y_IRS,USD_10Y_IRS,EUR_10Y_IRS}
      - MARKET_DATA_FUTURES_CONTRACTS=${MARKET_DATA_FUTURES_CONTRACTS:-ES:SPY:50,MES:SPY:5,NQ:QQQ:20}
      - PROVIDER_FETCH_TIMEOUT_SECONDS=${PROVIDER_FETCH_TIMEOUT_SECONDS:-1.0}
      - MARKET_DATA_MOCK_STREAM=${MARKET_DATA_MOCK_STREAM:-false}
      - MARKET_DATA_MOCK_INTERVAL_SECONDS=${MARKET_DATA_MOCK_INTERVAL_SECONDS:-2}
    depends_on: *depends-on-db
  trade-action-service:
    build: ./services/trade-action-service
    ports:
      - "8080:8080"
    volumes:
      - ./shared:/app/shared
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - TRADE_ACTION_QUEUE_MAXSIZE=${TRADE_ACTION_QUEUE_MAXSIZE:-100}
      - TRADE_VALUATION_QUEUE_MAXSIZE=${TRADE_VALUATION_QUEUE_MAXSIZE:-100}
      - USE_PROVIDER_DATA=${USE_PROVIDER_DATA:-false}
    depends_on: *depends-on-db
    